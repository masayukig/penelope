# Every job calls a Makefile target, so there is nothing here that can be run
# in CI but not on a laptop.
name: CI

on:
  push:
    branches: [main]
  # No paths filter: Renovate merges a patch update once these checks pass,
  # so every pull request has to be tested whatever it changes.
  pull_request:

# Deciding whether a pull request is good writes nothing. Work that writes
# lives in release.yml and in the main image jobs at the end, which run on a
# push to main only, with the permission on the job that needs it.
permissions:
  contents: read

# A pull request that gets pushed to again drops its earlier run. Pushes to
# main are not cancelled: every commit on main should have its own result.
# They still run one at a time, so the main images of an older commit never
# overwrite a newer one's, and two cleanups never run at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt, vet, typecheck, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The same Node as the Dockerfile's, kept so by Renovate's node group.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: npm
      - run: make fmt-check
      - run: make vet
      - run: make typecheck
      - run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    # On a cold runner golangci-lint is built from source first.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint

  # `go mod tidy` has to be something anyone can run, and Renovate runs it
  # after every update (postUpdateOptions: gomodTidy, next to
  # gomodUpdateImportPaths, which rewrites imports on a major update). The
  # npm lock needs no job of its own: npm ci in the check job fails when it
  # does not match the package.json files.
  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make tidy
      - name: go.mod and go.sum are unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::tidying changed the working tree. Run \`make tidy\` and commit the result."
            exit 1
          fi

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vuln

  # A release builds these images from commits nobody looked at (the weekly
  # release), so a Dockerfile that no longer builds has to fail here first.
  # Only this runner's platform: release.yml builds the other one.
  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: make images

  # The Pod end to end with Docker Compose and fakes (e2e/README.md). The
  # runner has Docker, and the init container's iptables runs in the Pod's
  # own network namespace, so nothing of the runner is changed.
  e2e:
    name: end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The same Node as the Dockerfile's, kept so by Renovate's node group.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: npm
      - run: make e2e

  # On a push to main, every image of a release is pushed under the moving
  # tag main, for the vulnerability tracker to scan: it tells a vulnerability
  # fixed on main but not yet released from one not fixed (ADR 0037). Nothing
  # runs these images. The platforms and the labels are those of
  # release.yml; the labels name this repository and the commit.
  main-image:
    name: main image (${{ matrix.target }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [sentinel, backend, receivers, sandbox]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # As in release.yml: two final stages run commands of their platform.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.target }}:main
          build-args: VERSION=main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main

  # Each push of main leaves the version main pointed at before untagged.
  # Only untagged versions are deleted, never a tagged one: the action keeps
  # or deletes an image's platform manifests and attestations with its index.
  # validate then warns in the log of any image left with a platform missing.
  # A release can be pushing at the same time (a fix merged starts both), and
  # its platform manifests stay untagged until its index is pushed, so only
  # versions older than any push in flight are deleted.
  main-image-cleanup:
    name: main image cleanup (${{ matrix.target }})
    needs: main-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      matrix:
        target: [sentinel, backend, receivers, sandbox]
    steps:
      # Pinned to a commit, unlike the other actions: a third party's action
      # that can delete package versions.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: penelope-${{ matrix.target }}
          delete-untagged: true
          older-than: 1 hour
          validate: true
