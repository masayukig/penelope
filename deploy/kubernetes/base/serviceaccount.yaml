# The Pod's identity. It gets no RBAC here. The Sentinel is the only
# container that gets its token (projected), and puts it in place of a
# surrogate for the hosts the overlay registers with it (the cluster's API
# server, an A2A agent that checks callers by TokenReview).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: penelope
automountServiceAccountToken: false
