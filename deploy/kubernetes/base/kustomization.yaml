apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What every deployment of the Pod has in common (README.md). The overlay
# gives what is its own: the ConfigMaps penelope-backend-env,
# penelope-sandbox-env, penelope-models, penelope-sentinel,
# penelope-connectors and penelope-receivers (and optionally penelope-skills),
# the Secrets penelope-sentinel-ca, penelope-sentinel and penelope-backend
# (and optionally penelope-receivers), the namespace and the images' version.
# The base is not an entry point of its own.

resources:
- serviceaccount.yaml
- pvc.yaml
- statefulset.yaml
- service.yaml

images:
- name: registry.k8s.io/build-image/distroless-iptables
  newTag: v0.11.2

configMapGenerator:
- name: penelope-init
  files:
  - init/redirect.sh
  - init/volumes.sh
  - init/skills.sh
  - init/avatar.sh
