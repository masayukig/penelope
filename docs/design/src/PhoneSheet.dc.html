<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマートフォン いまのエージェントを開いた</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="color-scheme: {{scheme}}; --color-background-body: light-dark(#f1f1f1, #1b1b1b); --color-background-surface: light-dark(#ffffff, #262626); --color-text-primary: light-dark(#000000, #ffffff); --color-text-secondary: light-dark(#474747, #9e9e9e); --color-border-emphasized: light-dark(#d4d4d4, #525252); --color-overlay: light-dark(#00000080, #000000CC); position: relative; width: 390px; height: 844px; overflow: hidden; color: var(--color-text-primary); font-family: Figtree, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 16px; line-height: 1.6">

<dc-import name="Phone" subs="{{subs}}" dark="{{dark}}" hint-size="390px,844px"></dc-import>

<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--color-overlay)"></div>

<section aria-label="いまのエージェント" style="position: absolute; left: 0; right: 0; bottom: 0; height: 660px; box-sizing: border-box; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background: var(--color-background-surface); border-radius: 28px 28px 0 0">
<span aria-hidden="true" style="flex: none; align-self: center; width: 40px; height: 4px; border-radius: 9999px; background: var(--color-border-emphasized)"></span>
<div style="flex: none; padding: 16px 0 12px; display: flex; justify-content: center; border-radius: 0.75rem; background: var(--color-background-body)">
<dc-import name="Avatar" d="88px" label="{{ true }}" hint-size="88px,126px"></dc-import>
</div>
<div style="flex: none; display: flex; flex-direction: column; gap: 2px; font-size: 14px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">承認待ち</h2>
<p style="margin: 0; color: var(--color-text-secondary)">いまはありません</p>
</div>
<div style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 20px">
<sc-if value="{{hasSubs}}" hint-placeholder-val="{{ false }}">
<dc-import name="Agents" n="{{subs}}" hint-size="100%,240px"></dc-import>
</sc-if>
<dc-import name="Activity" hint-size="100%,400px"></dc-import>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"subs":{"editor":"int","default":0,"min":0,"max":6},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = !!this.props.dark;
const subs = Number(this.props.subs ?? 0);
return { subs: subs, hasSubs: subs > 0, dark: dark, scheme: dark ? 'dark' : 'light' };
}
}
</script>
</body>
</html>
