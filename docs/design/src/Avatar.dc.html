<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アバター（固定のアイコンと expression）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="--color-text-primary: light-dark(#000000, #ffffff); --color-neutral: light-dark(#0000000F, #ffffff1A); --color-accent: light-dark(#1b1b1b, #f1f1f1); --color-on-accent: light-dark(#ffffff, #111111); display: inline-flex; flex-direction: column; align-items: center; gap: 10px; color: var(--color-text-primary); font-family: Figtree, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.4">
<span role="img" aria-label="エージェントのアイコン（設定から入る）" style="flex: none; width: {{d}}; height: {{d}}; border-radius: 9999px; background: var(--color-accent); display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="50%" height="50%" viewBox="0 0 24 24" fill="none" stroke="var(--color-on-accent)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M8.500 14c1 1.300 2.200 2 3.500 2s2.500-.700 3.500-2"/></svg>
</span>
<sc-if value="{{label}}" hint-placeholder-val="{{ false }}">
<span style="padding: 3px 12px; border-radius: 9999px; background: {{chipBg}}">考え中</span>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"d":{"editor":"text","default":"120px"},"label":{"editor":"boolean","default":true},"solid":{"editor":"boolean","default":false},"$preview":{"width":200,"height":220}}'>
class Component extends DCLogic {
renderVals() {
return {
chipBg: this.props.solid ? 'light-dark(#ffffff, #262626)' : 'var(--color-neutral)',
d: this.props.d ?? '120px',
label: this.props.label ?? true
};
}
}
</script>
</body>
</html>
