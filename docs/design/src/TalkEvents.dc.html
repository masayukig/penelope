<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>会話の流れの中に出来事を置く案</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="--color-background-body: light-dark(#f1f1f1, #1b1b1b); --color-background-surface: light-dark(#ffffff, #262626); --color-text-primary: light-dark(#000000, #ffffff); --color-text-secondary: light-dark(#474747, #9e9e9e); --color-border: light-dark(#00000014, #ffffff1A); --color-neutral: light-dark(#0000000F, #ffffff1A); --color-accent: light-dark(#1b1b1b, #f1f1f1); --color-on-accent: light-dark(#ffffff, #111111); width: 100%; box-sizing: border-box; padding: 24px 20px 32px; background: var(--color-background-body); color: var(--color-text-primary); font-family: Figtree, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: {{size}}; line-height: 1.7">
<div style="width: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column">

<sc-for list="{{items}}" as="it" hint-placeholder-count="8">
<div style="margin-top: {{it.mt}}; display: flex; flex-direction: column">

<sc-if value="{{it.isDay}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px; color: var(--color-text-secondary); font-size: 12px">
<span style="flex: 1; height: 1px; background: var(--color-border)"></span>
<span>{{it.text}}</span>
<span style="flex: 1; height: 1px; background: var(--color-border)"></span>
</div>
</sc-if>

<sc-if value="{{it.isPlain}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0 auto; max-width: 78%; box-sizing: border-box; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: center; font-size: 12px; line-height: 1.5; color: var(--color-text-secondary)"><span style="font-variant-numeric: tabular-nums">{{it.time}}</span> <strong style="font-weight: 600">{{it.kind}}</strong> {{it.text}}</p>
</sc-if>

<sc-if value="{{it.isPill}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0 auto; max-width: 78%; box-sizing: border-box; padding: 2px 12px; border-radius: 9999px; background: var(--color-neutral); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: center; font-size: 12px; line-height: 1.5; color: var(--color-text-secondary)"><span style="font-variant-numeric: tabular-nums">{{it.time}}</span> <strong style="font-weight: 600">{{it.kind}}</strong> {{it.text}}</p>
</sc-if>

<sc-if value="{{it.isAgent}}" hint-placeholder-val="{{ true }}">
<article style="display: flex; align-items: flex-start; gap: 8px; max-width: 88%">
<span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--color-accent); display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-on-accent)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M8.500 14c1 1.300 2.200 2 3.500 2s2.500-.700 3.500-2"/></svg>
</span>
<div style="min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px">
<p style="margin: 0; padding: 10px 16px; border-radius: 16px; background: var(--color-background-surface); border: 1px solid var(--color-border); text-wrap: pretty">{{it.text}}</p>
<span style="padding-left: 16px; font-size: 12px; color: var(--color-text-secondary)">{{it.time}}</span>
</div>
</article>
</sc-if>

<sc-if value="{{it.isOwner}}" hint-placeholder-val="{{ false }}">
<article style="align-self: flex-end; max-width: 80%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<p style="margin: 0; padding: 10px 16px; border-radius: 16px; background: var(--color-neutral)">{{it.text}}</p>
<span style="padding-right: 16px; font-size: 12px; color: var(--color-text-secondary)">{{it.time}}</span>
</article>
</sc-if>

</div>
</sc-for>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"v":{"editor":"enum","options":["plain","pill","all","grouped"],"default":"plain"},"size":{"editor":"text","default":"14px"},"$preview":{"width":760,"height":760}}'>
class Component extends DCLogic {
renderVals() {
const v = this.props.v ?? 'plain';
const every = v === 'all' || v === 'grouped';
const style = v === 'pill' ? 'pill' : 'plain';
const ev = (time, kind, text) => ({ t: 'ev', time: every ? time : '', kind: kind, text: text });
const a = (time, text) => ({ t: 'agent', time: time, text: text });
const o = (time, text) => ({ t: 'owner', time: time, text: text });
const quiet = [
ev('7:40', '自分から', '静かな時間が続いた'),
ev('7:52', 'GitHub', 'PR にレビューの依頼が来た'),
ev('8:10', '自分から', '静かな時間が続いた')
];
let list = [
{ t: 'day', text: '今日' },
ev('6:00', '予約', '朝の予定確認（毎朝6:00 JST）。予定の係へ A2A で依頼し、今日から 7 日先までの予定を取得する。'),
a('6:00', 'ユウ、おはよう。今日は午前中に宅配の集荷、15:00〜16:00に午後出社だよ。'),
every ? ev('7:08', 'ほかのエージェント', 'メールの係から結果が届いた') : null,
a('7:09', '朝のメール、昨日7時〜今朝7時の分を確認したよ。気をつけたいのは 3 件。'),
v === 'all' ? quiet[0] : null, v === 'all' ? quiet[1] : null, v === 'all' ? quiet[2] : null,
v === 'grouped' ? { t: 'ev', time: '7:40〜8:10', kind: '返事のない出来事 3 件', text: '自分から 2 ・ GitHub 1' } : null,
o('8:37', 'おはよう、間違いに気づくのはさすがだね！'),
a('8:38', 'おはよう、ユウ。ありがとう。記憶と照らして気づけてよかった。'),
ev('10:11', 'alertmanager', '[FIRING warning] HighMemoryUsage'),
a('10:12', 'メモリの使用量が上がっていたのは、バッチの Job が重なったためでした。いまは下がっています。')
].filter((x) => x);
const items = list.map((x, i) => {
const prev = list[i - 1];
let mt = '28px';
if (i === 0) mt = '0';
else if (x.t === 'ev' && prev.t === 'ev') mt = '6px';
else if (x.t === 'ev') mt = '24px';
else if (prev.t === 'ev') mt = '12px';
return { mt: mt, text: x.text, time: x.time || '', kind: x.kind || '',
isDay: x.t === 'day', isAgent: x.t === 'agent', isOwner: x.t === 'owner',
isPlain: x.t === 'ev' && style === 'plain', isPill: x.t === 'ev' && style === 'pill' };
});
return { size: this.props.size ?? '14px', items: items };
}
}
</script>
</body>
</html>
