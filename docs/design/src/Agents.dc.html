<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>サブエージェントの欄</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section aria-labelledby="ag-title" style="--color-text-primary: light-dark(#000000, #ffffff); --color-text-secondary: light-dark(#474747, #9e9e9e); --color-border: light-dark(#00000014, #ffffff1A); --color-neutral: light-dark(#0000000F, #ffffff1A); --color-text-info: light-dark(#0067ce, #a1caff); width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; color: var(--color-text-primary); font-family: Figtree, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.5">

<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--color-text-secondary)">
<h2 id="ag-title" style="margin: 0; font-size: 12px; font-weight: 600">サブエージェント</h2>
<span>{{summary}}</span>
</div>

<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{agents}}" as="a" hint-placeholder-count="3">
<li style="border: 1px solid var(--color-border); border-radius: 0.625rem; display: flex; flex-direction: column">
<button type="button" onClick="{{a.toggle}}" aria-expanded="{{a.openStr}}" style="width: 100%; min-height: 44px; box-sizing: border-box; padding: 10px 12px; border: 0; border-radius: 0.625rem; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: 8px">
<sc-if value="{{a.running}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="flex: none; width: 8px; height: 8px; border-radius: 9999px; background: var(--color-text-info)"></span>
</sc-if>
<sc-if value="{{a.waiting}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" style="flex: none" width="8" height="10" viewBox="0 0 8 10" fill="var(--color-text-secondary)"><rect x="0" y="0" width="3" height="10" rx="1"/><rect x="5" y="0" width="3" height="10" rx="1"/></svg>
</sc-if>
<span style="flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: ui-monospace, 'SF Mono', Monaco, Consolas, monospace; font-size: 13px; font-weight: 600">{{a.name}}</span>
<span style="flex: none; font-size: 12px; color: var(--color-text-secondary)">{{a.stateText}}</span>
<svg aria-hidden="true" style="flex: none" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</span>
<span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px">{{a.purpose}}</span>
<sc-if value="{{a.running}}" hint-placeholder-val="{{ true }}">
<span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: ui-monospace, 'SF Mono', Monaco, Consolas, monospace; font-size: 12px; color: var(--color-text-secondary)">{{a.latest}}</span>
</sc-if>
</button>
<sc-if value="{{a.open}}" hint-placeholder-val="{{ false }}">
<ol style="list-style: none; margin: 0; padding: 4px 12px 14px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--color-border)">
<li style="padding-top: 10px; font-size: 13px">テストクラスタで Kubernetes 1.38 への更新を試す</li>
<li style="display: flex; align-items: center; gap: 12px; color: var(--color-text-secondary); font-size: 12px">
<span style="flex: 1; height: 1px; background: var(--color-border)"></span>
<span>ターンの始まり 13:10</span>
<span style="flex: 1; height: 1px; background: var(--color-border)"></span>
</li>
<li style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">思考</span>
<span style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">コントロールプレーンは 1.38 に上がった。次はワーカーを 1 台ずつ drain して更新する。まず全ノードの状態を確かめる。</span>
</li>
<li style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap">
<span style="font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">ツール</span>
<code style="font-family: ui-monospace, 'SF Mono', Monaco, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere"><strong>bash</strong>: kubectl get nodes</code>
</li>
<li role="img" aria-label="書いている途中" style="display: flex; gap: 4px; padding: 2px 0">
<span style="width: 6px; height: 6px; border-radius: 9999px; background: var(--color-text-secondary)"></span>
<span style="width: 6px; height: 6px; border-radius: 9999px; background: var(--color-text-secondary); opacity: 0.6"></span>
<span style="width: 6px; height: 6px; border-radius: 9999px; background: var(--color-text-secondary); opacity: 0.3"></span>
</li>
</ol>
</sc-if>
</li>
</sc-for>
</ul>

</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"n":{"editor":"int","default":3,"min":1,"max":6},"$preview":{"width":400,"height":620}}'>
class Component extends DCLogic {
renderVals() {
const all = [
{ id: 'cluster-test', purpose: 'テストクラスタで Kubernetes 1.38 への更新を試す', state: 'tool', latest: 'bash: kubectl get nodes' },
{ id: 'renovate-review', purpose: 'Renovate の PR をまとめて確かめる', state: 'think', latest: '思考: 残りは 4 件。次は cert-manager の更新を見る' },
{ id: 'fleet-infra-fix', purpose: 'fleet-infra の失敗している Kustomization を直す', state: 'wait', latest: '' },
{ id: 'cert-audit', purpose: '証明書の期限を一覧にする', state: 'tool', latest: 'bash: kubectl get certificates -A' },
{ id: 'loki-retention', purpose: 'Loki の保存期間を延ばす案を作る', state: 'wait', latest: '' },
{ id: 'backup-check', purpose: '昨夜のバックアップが復元できるか確かめる', state: 'tool', latest: 'read: /memory/backup.md' }
];
const n = Math.max(1, Math.min(6, Number(this.props.n ?? 3)));
const s = this.state || {};
const openId = s.openId === undefined ? (n === 1 ? 'cluster-test' : null) : s.openId;
const list = all.slice(0, n);
const run = list.filter((a) => a.state !== 'wait').length;
const wait = list.length - run;
const label = { tool: 'ツールを使っている', think: '考えている', wait: '止まって待っている' };
return {
summary: wait > 0 ? ('走っている ' + run + ' ・ 待っている ' + wait) : ('走っている ' + run),
agents: list.map((a) => ({
name: a.id,
purpose: a.purpose,
latest: a.latest,
stateText: label[a.state],
running: a.state !== 'wait',
waiting: a.state === 'wait',
open: openId === a.id,
openStr: openId === a.id ? 'true' : 'false',
toggle: () => this.setState({ openId: openId === a.id ? null : a.id })
}))
};
}
}
</script>
</body>
</html>
